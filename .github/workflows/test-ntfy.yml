name: Test ntfy Notifications

on:
  workflow_dispatch:

jobs:
  test-ntfy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send test notification
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$NTFY_URL" ]]; then
            echo "NTFY_URL secret is not configured"
            exit 1
          fi
          if [[ -z "$NTFY_TOKEN" ]]; then
            echo "NTFY_TOKEN secret is not configured"
            exit 1
          fi

          curl --fail-with-body --show-error --silent \
            --connect-timeout 10 --max-time 30 \
            --write-out '\nHTTP %{http_code}\n' \
            -H "Title: 🧪 Caddy ntfy test" \
            -H "Priority: default" \
            -H "Tags: test,docker" \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -d "Test notification from the Caddy Cloudflare DDNS workflow." \
            "$NTFY_URL"
